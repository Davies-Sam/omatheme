<?xml version="1.0" encoding="UTF-8"?>
<!-- The app's face is the thing it edits: a window wearing the gradient
     border from the Border panel's default (#7c7af7 -> #88f77a, 45deg),
     with a four-swatch palette row inside (four, because Quattro). -->
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="border" x1="0" y1="256" x2="256" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c7af7"/>
      <stop offset="1" stop-color="#88f77a"/>
    </linearGradient>
  </defs>
  <rect x="14" y="14" width="228" height="228" rx="48" fill="#1a1b26"/>
  <rect x="20" y="20" width="216" height="216" rx="42" fill="none"
        stroke="url(#border)" stroke-width="12"/>
  <circle cx="65" cy="128" r="25" fill="#7aa2f7"/>
  <circle cx="107" cy="128" r="25" fill="#9ece6a" fill-opacity="0.92"/>
  <circle cx="149" cy="128" r="25" fill="#ff9e64" fill-opacity="0.85"/>
  <circle cx="191" cy="128" r="25" fill="#f7768e" fill-opacity="0.78"/>
</svg>
